name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@main
    secrets: inherit
    with:
      name: MonoText
      app: .build/MonoText.app
      cask: monotext
      runner: macos-26
      build: |
        swift build -c release
        ./bundle.sh release
